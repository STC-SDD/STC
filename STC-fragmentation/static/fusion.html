<!DOCTYPE html>
<html>
<head>
  <style>
    #subtitle {
      position: absolute;
      bottom: 40px;
      width: 100%;
      text-align: center;
      font-size: 22px;
      color: white;
      text-shadow: 2px 2px 4px black;
    }
    #container {
      position: relative;
      width: 640px;
    }
  </style>
</head>
<body>

<div id="container">
  <video id="video" width="640" controls>
    <!-- Chemin correct depuis FastAPI -->
    <source src="/video/sous_titrage.mp4" type="video/mp4">
  </video>
  <div id="subtitle"></div>
</div>

<script>
  let fragments = [];

fetch("/subtitles")
  .then(res => res.json())
  .then(data => {
    // Convertir objet en tableau
    fragments = Object.values(data).sort((a, b) => a.start - b.start);
    console.log(fragments); // <--- Vérifie dans la console que c'est bien un tableau
  });

const video = document.getElementById("video");
const subtitleEl = document.getElementById("subtitle");

video.ontimeupdate = () => {
  const t = video.currentTime;
  const f = fragments.find(fr => t >= fr.start && t < fr.end);
  subtitleEl.textContent = f ? f.text : "";
};
</script>


</body>
</html>
