<!DOCTYPE html>
<html>
<head>
  <style>
    #subtitle {
      position: absolute;
      bottom: 40px;
      width: 100%;
      text-align: center;
      font-size: 22px;
      color: white;
      text-shadow: 2px 2px 4px black;
    }
    #container {
      position: relative;
      width: 640px;
    }
  </style>
</head>
<body>

<div id="container">
  <video id="video" width="640" controls>
    <source src="/video/sous_titrage.mp4" type="video/mp4">
  </video>
  <div id="subtitle"></div>
</div>

<script>
  let fragments = [];

  // Récupération des sous-titres depuis FastAPI
  fetch("/subtitles")
    .then(res => res.json())
    .then(data => {
      // Transformer en tableau si nécessaire et trier par start
      fragments = Array.isArray(data) ? data : Object.values(data);
      fragments.sort((a, b) => a.start - b.start);
      console.log("Fragments:", fragments); // pour debug
    })
    .catch(err => console.error("Erreur fetch:", err));

  const video = document.getElementById("video");
  const subtitleEl = document.getElementById("subtitle");

  // Affichage en temps réel
  video.addEventListener("timeupdate", () => {
    const t = video.currentTime;
    const f = fragments.find(fr => t >= fr.start && t < fr.end);
    subtitleEl.textContent = f ? f.text : "";
  });
</script>

</body>
</html>
