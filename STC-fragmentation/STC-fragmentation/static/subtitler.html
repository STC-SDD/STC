    <!DOCTYPE html>
    <html>
    <head>
      <title>Sous-titreur</title>
            <!-- Subtitler page: plays video immediately (autoplay),
                     falls back to a small button if browser blocks unmuted autoplay.
                     Receives assigned fragments via WebSocket; no admin control needed. -->
      <style>
        #subtitle { position: absolute; bottom: 40px; width: 100%; text-align: center; font-size: 22px; color: white; text-shadow: 2px 2px 4px black; }
        #container { position: relative; width: 640px; }
      </style>
    </head>
    <body>
      <h2>Interface Sous-titreur</h2>
        <div id="container">
        <video id="video" width="640" autoplay playsinline>
  <source src="/video/sous_titrage.mp4" type="video/mp4">
</video>

        <div id="subtitle"></div>
      </div>
            <div id="autoplayHint" style="margin-top:10px; display:none; color:#e67e22;">
                Playback was blocked by the browser. Click to start:
                <button id="startPlaybackBtn">Start Playback</button>
            </div>
            <div>
        <input type="text" id="inputSubtitle" placeholder="Écrire le sous-titre..." disabled>
        <button id="submitBtn" disabled>Soumettre</button>
      </div>

      

      <div id="fragments"></div>
      

<script>
const sous_titreur = prompt("Entrez votre nom de sous-titreur :");
const ws = new WebSocket(`ws://localhost:8000/ws/${sous_titreur}`);

let fragments = [];
let currentFrag = null;
let waitingSubmission = false;

const fragmentsDiv = document.getElementById("fragments");
const input = document.getElementById("inputSubtitle");
const btn = document.getElementById("submitBtn");
const video = document.getElementById("video");
let status = { textContent: "" }; // Pour compat compat avec ton ancien code

// --- Réception WebSocket ---
ws.onmessage = (event) => {

    // 1) Fin de session
    if (event.data === "FIN") {
        fragments = [];
        currentFrag = null;
        waitingSubmission = false;
        input.disabled = true;
        btn.disabled = true;
        video.muted = false;

        fragmentsDiv.innerHTML += `<p style="color:green;"><b>✔ Tous les fragments sont terminés.</b></p>`;
        return;
    }

    // 2) Réception d’un fragment
    const parts = event.data.split(" ");
    if (parts[0] === "FRAG") {

        const frag = {
            id: parts[1],
            start: parseFloat(parts[2]),
            end: parseFloat(parts[3]),
            submitted: false
        };

        fragments = [frag];
        currentFrag = frag;

        fragmentsDiv.innerHTML = `<p><b>Fragment :</b> ${frag.start}s → ${frag.end}s</p>`;
        input.disabled = true;   // activé seulement quand la vidéo entre dans la fenêtre du fragment
        btn.disabled = true;
    }
};


// --- Gestion de la vidéo : active input quand il faut ---
video.ontimeupdate = () => {
    const t = video.currentTime;
    if (!currentFrag) return;

    // Au début du fragment : activer la saisie
    if (t >= currentFrag.start && t < currentFrag.end) {
        input.disabled = false;
        btn.disabled = false;
    }

    // À la fin du fragment : en attente de soumission
    if (t >= currentFrag.end && !currentFrag.submitted) {
        video.muted = true;
        waitingSubmission = true;
        input.disabled = false;
        btn.disabled = false;
    }
};


// --- Bouton Soumettre ---
btn.onclick = () => {

    if (!currentFrag) {
        console.warn("Aucun fragment actif !");
        return;
    }

    const text = input.value.trim();
    if (text === "") return;

    // 1) Envoyer le texte du sous-titre
    ws.send(text);

    // 2) Envoyer l’info DONE au serveur
    ws.send("DONE " + currentFrag.id);

    // 3) Marquer le fragment comme soumis
    currentFrag.submitted = true;

    // 4) Réinitialiser l’UI
    video.muted = false;
    input.value = "";
    input.disabled = true;
    btn.disabled = true;

    waitingSubmission = false;
};
</script>




    </body>
    </html>
