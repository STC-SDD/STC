<!DOCTYPE html>
<html>
<head>
  <style>
    #subtitle {
      position: absolute;
      bottom: 40px;
      width: 100%;
      text-align: center;
      font-size: 22px;
      color: white;
      text-shadow: 2px 2px 4px black;
    }
    #container {
      position: relative;
      width: 640px;
    }
  </style>
</head>
<body>

<div id="container">
  <video id="video" width="640" controls>
    <source src="sous_titrage.mp4" type="video/mp4">
  </video>
  <div id="subtitle"></div>
</div>

<script>
  let fragments = [];

  fetch("subtitles.json")
    .then(res => res.json())
    .then(data => {
      fragments = data.sort((a, b) => a.start - b.start);
    });

  const video = document.getElementById("video");
  const subtitleEl = document.getElementById("subtitle");

  video.ontimeupdate = () => {
    const t = video.currentTime;
    const f = fragments.find(fr => t >= fr.start && t < fr.end);
    subtitleEl.textContent = f ? f.text : "";
  };
</script>

</body>
</html>
